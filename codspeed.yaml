# yaml-language-server: $schema=https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json

# The driver reads its test files relative to the cwd, so the shell is invoked
# from the suite directory rather than through `mach jsshell-bench`, which would
# add ~2s of python startup to every measurement.
options:
  working-directory: third_party/webkit/PerformanceTests/six-speed

# test.js drives its own iteration counts internally (see `iteration_for_test`),
# so CodSpeed runs the whole command exactly once instead of adding rounds.
benchmarks:
  - name: six-speed-sm
    id: six-speed
    exec: ../../../../obj-codspeed/dist/bin/js --strict-benchmark-mode test.js
    options:
      warmup-time: 0s
      max-rounds: 1
