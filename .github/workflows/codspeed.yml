name: CodSpeed
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Install cargo-codspeed
      run: cargo install cargo-codspeed --locked
    - name: Build the benchmark targets
      run: cargo codspeed build --bench color_parsing
      working-directory: third_party/rust/cssparser
    - name: Run the benchmarks
      uses: CodSpeedHQ/action@v4
      with:
        upload-url: ${{ secrets.CODSPEED_STAGING_UPLOAD_URL }}
        mode: instrumentation
        run: cargo codspeed run --bench color_parsing
        working-directory: third_party/rust/cssparser
